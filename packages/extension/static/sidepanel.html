<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BastionPilot</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span id="status-dot" class="dot dot-off" title="守护进程连接状态"></span>
        <span class="brand-mark">BP</span>
        <span class="brand-name">BastionPilot <small>控制台</small></span>
      </div>
      <select id="session-select" title="当前终端会话" disabled>
        <option value="">未连接终端</option>
      </select>
      <button id="open-options" class="icon-btn" title="打开设置">⚙</button>
    </header>

    <main id="transcript" class="transcript">
      <div class="empty-hint">
        <p class="welcome-title">等待本地 Agent 活动</p>
        <p><strong>BastionPilot</strong> 在命令执行前显示审批卡片，并在这里显示 Agent 的共享上下文。</p>
        <p>
          1. 启动本地服务：<code>bastion-pilot daemon</code><br />
          2. 在<a href="#" id="empty-options-link">设置</a>中填入配对令牌<br />
          3. 打开堡垒机终端页面，并授权站点
        </p>
        <p>侧边栏不再提供聊天输入；请直接在 Claude Code / Codex 等 MCP 客户端中对话。</p>
        <p id="hook-hint" class="hidden">
          已经打开终端页面？授予站点权限后刷新一次页面，插件会在页面加载时自动接管终端。
        </p>
      </div>
    </main>

    <footer class="panel-footer">
      <div id="approvals" class="approvals"></div>
      <details id="approval-history" class="approval-history">
        <summary>
          <span>审批历史 · 当前终端</span>
          <span id="approval-history-count" class="approval-history-count">0</span>
        </summary>
        <div id="approval-history-list" class="approval-history-list"></div>
      </details>
      <div id="activity" class="activity" aria-live="polite">
        <span class="activity-pulse"></span><span id="activity-text">就绪 · 等待审批</span>
      </div>
      <div id="mode-status" class="mode-status">等待本地 Agent（MCP）</div>
      <div class="panel-foot">工具操作会经过审批并写入审计日志</div>
    </footer>

    <script src="sidepanel.js"></script>
  </body>
</html>
