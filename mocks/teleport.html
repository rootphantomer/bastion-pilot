<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Teleport - web-01</title>
    <link rel="stylesheet" href="assets/mock.css" />
    <style>
      body {
        background: #0f0b1e;
      }
    </style>
  </head>
  <body>
    <!-- BastionPilot mock · profile: teleport · terminalDomHints: .xterm, .xterm-screen -->
    <section class="mock-login" id="login" style="background: #0f0b1e">
      <form onsubmit="return doLogin(event)">
        <h2>Teleport</h2>
        <div class="sub">teleport profile — Gravitational Teleport web terminal 风格</div>
        <label>用户名</label><input id="lu" value="admin" /> <label>密码</label
        ><input id="lp" type="password" value="mock" />
        <button style="background: #512fc9">登 录</button>
        <div class="hint">
          这是 BastionPilot 的本地模拟页面（不需要真实堡垒机）。任意凭据可登录， 登录后会出现
          xterm.js 模拟终端，用于验证扩展的会话识别与终端交互。
        </div>
      </form>
    </section>

    <div class="mock-layout" id="term-page" style="display: none">
      <div class="mock-main">
        <div
          class="mock-topbar"
          style="background: #151221; color: #c4b5fd; border-bottom: 1px solid #2a2440"
        >
          <b style="color: #a5b4fc">➜ teleport</b> · cluster: root · node: web-01 · session:
          t-el-9f21
        </div>
        <div class="mock-terminal-wrap">
          <div id="mock-term-host" class=""></div>
          <div class="mock-badge">profile: teleport</div>
        </div>
      </div>
    </div>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script>
      window.MOCK_CFG = {
        ws: true,
        el: '#mock-term-host',
        prompt: '[root@web-01 ~]$ ',
        hostname: 'web-01',
        banner: '> Connecting to node "web-01" in cluster "root"...',
        welcomeNote: '> Session t-el-9f21 started',
      };
      function doLogin(e) {
        e.preventDefault();
        document.getElementById('login').style.display = 'none';
        document.getElementById('term-page').style.display = 'flex';
        setTimeout(() => {
          window.dispatchEvent(new Event('resize'));
        }, 50);
        return false;
      }
    </script>
    <script src="assets/mock-terminal.js"></script>
  </body>
</html>
